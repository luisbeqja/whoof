<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#222222"/>
      <stop offset="60%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#070707"/>
    </radialGradient>
    <radialGradient id="dot" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#ddff7a"/>
      <stop offset="55%" stop-color="#c8ff3d"/>
      <stop offset="100%" stop-color="#a6e01f"/>
    </radialGradient>
  </defs>

  <!-- squircle tile — iOS corner radius ~22.37% of 1024 = 229px -->
  <rect x="0" y="0" width="1024" height="1024" rx="229" ry="229" fill="url(#bg)"/>
  <!-- subtle inner highlight for depth -->
  <rect x="3" y="3" width="1018" height="1018" rx="226" ry="226" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>

  <!-- arc track (faint lime background) -->
  <circle cx="512" cy="512" r="300" fill="none" stroke="rgba(200,255,61,0.10)" stroke-width="34"/>

  <!-- progress arc: 296° visible (64° gap), starting at -58° -->
  <!-- circ = 2π×300 ≈ 1884.96; dash = 1884.96 × (296/360) ≈ 1550.05 -->
  <circle cx="512" cy="512" r="300" fill="none"
          stroke="#c8ff3d" stroke-width="34"
          stroke-dasharray="1550.05 1884.96"
          stroke-linecap="round"
          transform="rotate(-58 512 512)"/>

  <!-- center dot with radial gradient -->
  <circle cx="512" cy="512" r="118" fill="url(#dot)"/>
</svg>
