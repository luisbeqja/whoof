<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>whoof</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0a0b0d" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="Your WHOOP data, clean and simple — recovery, sleep and strain at a glance, plus an AI coach that knows your full history." />

<!-- Install as a real app (iOS Safari → Share → Add to Home Screen; Android Chrome → Install) -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="whoof" />
<meta name="format-detection" content="telephone=no" />

<link rel="apple-touch-icon" href="/icons/icon-180.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="mask-icon" href="/icons/icon.svg" color="#c8ff3d" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"></noscript>
<link rel="stylesheet" href="/mobile.css" />
</head>
<body>
<main id="app">
  <section id="screen-home" class="screen active"></section>
  <section id="screen-chat" class="screen"></section>
</main>

<nav class="bottom-nav">
  <button class="nav-item active" data-screen="home" aria-label="Home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    <span>Home</span>
  </button>
  <button class="nav-item" data-screen="chat" aria-label="Coach">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    <span>Coach</span>
  </button>
</nav>

<script type="module" src="/js/mobile/app.js"></script>
<script>
  // PWA service worker — registered after load so it doesn't delay first paint.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch((err) => console.warn('[sw]', err));
    });
  }
</script>
</body>
</html>
